<main><div class="row sp"><h1>🎣 Pesca Cádiz</h1><span class="mu" id="src"></span></div><div id="v"></div>
<p class="mu">Índice S = 0,35·M + 0,25·V + 0,15·O + 0,10·P + 0,10·T + 0,05·L. Veto: viento &gt; 40 km/h, ola &gt; 2 m o aviso AEMET. Coordenadas y orientaciones de playa aproximadas; confirma siempre avisos oficiales y accesos antes de salir.</p></main>

<script>
const $=s=>document.querySelector(s),f2=n=>String(n).padStart(2,"0"),cl=(x,a=0,b=100)=>Math.max(a,Math.min(b,x)),ang=(a,b)=>{const d=Math.abs(a-b)%360;return Math.min(d,360-d)};

let src="Datos simulados (demo)";

function calc(si,sp,t){const[,,,,or,ty]=S[si],w=W[t+6],w0=W[t],c=SPC[sp],tp=hw(t),dp=Math.abs(t-tp),db=Math.abs(t-lw(t)),C=Cf(tp),v=w.v;

const dl=ang(w.d,or),rc=w.r-v;let V=v<=10?95:v<=20?75:v<=35?45:v<=40?20:0;
V=cl(V+(dl<=45?(v>15?-15:0):dl>=135?(v<=25?10:-5):0)+(rc<=15?0:rc<=25?-10:-20));

function vMap(){const si=st.sp,L=st.lay,cf={bat:["#1d5f86","#d9d0b4","255,255,255"],sat:["#0f3345","#4f6538","120,220,200"],car:["#d3e9f6","#f1e6b4","255,255,255"]}[L],pt=p=>p.map(([a,b])=>P(a,b).join(",")).join(" ");

LND.forEach(p=>[[40,.07],[24,.1],[10,.14]].forEach(([w,a])=>o+=`<polygon points="${pt(p)}" fill="none" stroke="rgba(${cf[2]},${a})" stroke-width="${w}" stroke-linejoin="round"/>`));

return o+days(null)+`<div class="cd"><div class="row sp"><div><b>${s[0]}</b><br><span class="mu">${s[1]}</span></div><button class="bt" data-a="fav" data-v="${si}">${st.fav.includes(si)?"★":"☆"}</button></div><div class="ch" style="margin:8px 0 0">${gps(si)}</div></div><div class="cd"><h2>Previsión horaria</h2>${tbl(si,st.day,st.day==0?Math.min(new Date().getHours(),12):6,12)}</div>`}
function vCmp(){const sp=st.spec,d=st.day,all=S.map((s,i)=>{const A=DS(i,sp,d),b=best(A),h=b<0?12:b;return{i,b,r:A[h],h}});
let L=st.only?all.filter(x=>st.fav.includes(x.i)):all.slice();L.sort((a,c)=>(c.b>=0)-(a.b>=0)||c.r.S-a.r.S);

return chips()+days(null)+`<div class="ch"><button class="bt ${st.only?"on":""}" data-a="only">★ Solo favoritas</button></div><p class="mu" style="margin:0 0 8px">Ranking de ${SPC[sp][0].toLowerCase()} para ${dn(d)}: primero las seguras, ordenadas por su mejor hora. Pulsa ⇄ para comparar hasta 3.</p>`+par
+(L.map((x,k)=>{const r=x.r,s=S[x.i];return`<div class="cd"><div class="row"><div class="k ${x.b<0?"x":cc(r)}">${x.b<0?"⚠":r.S}</div><div style="flex:1"><b>${k+1}. ${s[0]}</b><br><span class="mu">${s[1]} · ${x.b<0?"No recomendable":lb(r)+" a las "+f2(x.h)+":00"}</span><br><span class="mu">💨 ${Math.round(r.w.v)} km/h · 🌊 ${r.Hs.toFixed(1)} m · coef. ${r.C}</span></div><div class="row"><button class="bt" data-a="fav" data-v="${x.i}">${st.fav.includes(x.i)?"★":"☆"}</button><button class="bt ${st.cmp.includes(x.i)?"on":""}" data-a="cmp" data-v="${x.i}">⇄</button></div></div></div>`}).join("")||`<div class="cd mu">Aún no tienes playas favoritas. Pulsa ☆ en cualquier playa para guardarla.</div>`)}
function vDi(){const D=st.diary,cap=D.reduce((a,e)=>a+e.cap,0),av=a=>a.length?Math.round(a.reduce((s,e)=>s+e.S,0)/a.length):"–",cb={};
D.forEach(e=>{const k=(e.cebo||"").toLowerCase();if(k)cb[k]=(cb[k]||0)+e.cap});const tb=Object.entries(cb).sort((a,b)=>b[1]-a[1])[0],nw=new Date().getHours(),r=calc(st.sp,st.spec,nw),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const op=(a,sel)=>a.map((n,i)=>`<option value="${i}" ${i==sel?"selected":""}>${n}</option>`).join("");
return`<div class="cd"><h2>Nueva jornada</h2><select id="ds">${op(S.map(s=>s[0]),st.sp)}</select><select id="dk">${Object.keys(SPC).map(k=>`<option value="${k}" ${k==st.spec?"selected":""}>${SPC[k][0]}</option>`).join("")}</select><input id="dc" placeholder="Cebo (ej. gamba, coquina)"><input id="dn" placeholder="Señuelo"><input id="dl" placeholder="Línea / bajo"><input id="dp" placeholder="Plomo"><div class="row"><input id="dq" type="number" min="0" inputmode="numeric" placeholder="Capturas"><input id="dv" type="number" min="0" inputmode="numeric" placeholder="Picadas"></div><p class="mu" style="margin:0 0 8px">Se guardará con la marea (${r.up?"subiendo":"bajando"}, coef. ${r.C}) y el índice actual (${r.S}).</p><button class="bt on" data-a="dsave" style="width:100%">Guardar jornada</button></div>`
+`<div class="cd"><h2>Estadísticas</h2><div class="gr"><div>Salidas<b>${D.length}</b></div><div>Capturas<b>${cap}</b></div><div>Mejor cebo<b>${tb?esc(tb[0])+" ("+tb[1]+")":"–"}</b></div><div>Índice con captura<b>${av(D.filter(e=>e.cap>0))}</b></div><div>Índice sin captura<b>${av(D.filter(e=>!e.cap))}</b></div><div>Capturas/salida<b>${D.length?(cap/D.length).toFixed(1):"–"}</b></div></div></div>`
+(D.slice(0,20).map((e,i)=>`<div class="cd"><div class="row sp"><b>${esc(S[e.sp][0])} · ${SPC[e.k][0]}</b><button class="bt" data-a="ddel" data-v="${i}" aria-label="Borrar">✕</button></div><span class="mu">${new Date(e.t).toLocaleDateString("es-ES")} · ${e.cap} capturas, ${e.pic} picadas · índice ${e.S} · ${esc(e.mar)}<br>${[e.cebo,e.sen,e.lin,e.plo].map(esc).filter(Boolean).join(" / ")||"Sin material anotado"}</span></div>`).join("")||`<div class="cd mu">Todavía no hay jornadas. Registra la primera para empezar a ver patrones propios.</div>`)}
function save(){const g=i=>$("#"+i).value.trim(),sp=+$("#ds").value,k=$("#dk").value,r=calc(sp,k,new Date().getHours());st.diary.unshift({t:Date.now(),sp,k,cebo:g("dc"),sen:g("dn"),lin:g("dl"),plo:g("dp"),cap:+g("dq")||0,pic:+g("dv")||0,S:r.S,mar:(r.up?"subiendo":"bajando")+", coef. "+r.C});if(st.diary.length>200)st.diary.pop()}
const lst=()=>{const q=st.q.toLowerCase(),L=S.map((s,i)=>i).filter(i=>(S[i][0]+" "+S[i][1]).toLowerCase().includes(q)).sort((a,b)=>st.fav.includes(b)-st.fav.includes(a));return L.map(i=>`<div class="cd row sp" data-a="pick" data-v="${i}"><div><b>${S[i][0]}</b><br><span class="mu">${S[i][1]}</span></div><span>${st.fav.includes(i)?"★":""}</span></div>`).join("")||`<p class="mu">Sin resultados. Prueba con otro nombre o municipio.</p>`};
function render(){$("#v").innerHTML={fc:vFc,map:vMap,cmp:vCmp,di:vDi}[st.tab]();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==st.tab));
$("#sh0").innerHTML=st.sheet?`<div class="sheet"><div class="row sp" style="margin-bottom:8px"><h1>Elegir playa</h1><button class="bt" data-a="close">Cerrar</button></div><input id="q" placeholder="Buscar playa o municipio" value="${st.q}"><div id="ls">${lst()}</div></div>`:"";$("#src").textContent=src}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,v=el.dataset.v,y=scrollY;
if(a=="tab"){st.tab=v;st.hr=null}else if(a=="sheet")st.sheet=true;else if(a=="close")st.sheet=false;
else if(a=="pick"){st.sp=+v;st.sheet=false;st.hr=null}
else if(a=="fav"){const i=+v,k=st.fav.indexOf(i);k<0?st.fav.push(i):st.fav.splice(k,1)}
else if(a=="spec"){st.spec=v;st.hr=null}else if(a=="day"){st.day=+v;st.hr=null}else if(a=="hr")st.hr=+v;else if(a=="lay")st.lay=v;
else if(a=="cmp"){const i=+v,k=st.cmp.indexOf(i);if(k<0){st.cmp.push(i);if(st.cmp.length>3)st.cmp.shift()}else st.cmp.splice(k,1)}
else if(a=="only")st.only=!st.only;else if(a=="dsave")save();else if(a=="ddel")st.diary.splice(+v,1);
sv();render();scrollTo(0,a=="tab"?0:y)});
document.addEventListener("input",e=>{if(e.target.id=="q"){st.q=e.target.value;$("#ls").innerHTML=lst()}});
ld();if(!S[st.sp])st.sp=0;render();live();
